name: egtanem_application
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  asset_cache: ^2.1.0

  # firebase_auth: ^5.2.1
  # firebase_core: ^3.4.1
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.10+1
  http: ^1.2.2
  equatable: ^2.0.5
  audioplayers: ^5.2.1

  flutter_dotenv: ^5.1.0
  shared_preferences: ^2.3.5

dev_dependencies:
  # flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - images/
    - assets/quran_images/
    - assets/quran_metadata/
    - assets/ui icons/
    - assets/.env

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
