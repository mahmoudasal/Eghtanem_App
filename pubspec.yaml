name: egtanem_application
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.4 <4.0.0"

dependencies:
  asset_cache: ^2.1.0
  audioplayers: ^6.1.1
  bloc: ^9.0.0
  build_runner: ^2.4.14
  dio: ^5.8.0+1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.0.17
  get_it: ^8.0.3
  http: ^1.3.0
  json_annotation: ^4.9.0
  json_serializable: ^6.9.3
  logger: ^2.5.0
  pretty_dio_logger: ^1.4.0
  provider: ^6.1.2
  retrofit: ^4.4.2
  retrofit_generator: ^9.1.7
  sentry_flutter: ^8.13.0
  shared_preferences: ^2.5.1
  shimmer: ^3.0.0
  video_player: ^2.9.2
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/cards_photos/
    - assets/quran_metadata/
    - assets/data/
    - assets/logo/
    - assets/icons/
    - assets/onboarding/
    - assets/Laravel-Islamic.postman_collection.json

  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
    - family: hafs
      fonts:
        - asset: assets/fonts/HafsSmart_08.ttf
          weight: 400
